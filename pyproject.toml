[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-stability-lab"
version = "0.1.0"
description = "A reproducible pilot framework for measuring LLM answer stability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
    "loguru>=0.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "lmstudio>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llm-stability-lab = "llm_stability_lab.cli:app"

[tool.setuptools]
packages = ["llm_stability_lab"]
package-dir = {llm_stability_lab = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
